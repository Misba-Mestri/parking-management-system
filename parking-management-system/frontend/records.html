<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Records — ParkDesk</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div class="brand-text">ParkDesk<span>Parking management</span></div>
    </div>
    <a class="nav-link" href="dashboard.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></a>
    <a class="nav-link" href="entry.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg><span>Vehicle entry</span></a>
    <a class="nav-link" href="exit.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M17 8l5 4-5 4"/><path d="M22 12H9"/></svg><span>Vehicle exit</span></a>
    <a class="nav-link active" href="records.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v3h8V3"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/></svg><span>Records</span></a>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span>Log out</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div class="header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v3h8V3"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/></svg>
      </div>
      <div class="header-text">
        <h1>Records</h1>
        <p>Every vehicle that has entered the facility.</p>
      </div>
    </div>

    <div class="card">
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search plate or owner…" />
        <select id="statusFilter">
          <option value="all">All statuses</option>
          <option value="parked">Currently parked</option>
          <option value="exited">Exited</option>
        </select>
        <select id="typeFilter">
          <option value="all">All types</option>
          <option value="bike">Two-wheeler</option>
          <option value="car">Car</option>
          <option value="heavy">Bus / Truck</option>
        </select>
      </div>

      <div id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Vehicle</th>
              <th>Owner</th>
              <th>Type</th>
              <th>Slot</th>
              <th>Entry</th>
              <th>Exit</th>
              <th>Duration</th>
              <th>Fee</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none;">No records match these filters.</div>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script>
  requireLogin();

  const searchInput = document.getElementById("searchInput");
  const statusFilter = document.getElementById("statusFilter");
  const typeFilter = document.getElementById("typeFilter");
  const tableBody = document.getElementById("tableBody");
  const emptyState = document.getElementById("emptyState");

  const typeLabels = { bike: "Two-wheeler", car: "Car", heavy: "Bus / Truck" };

  let debounceTimer;
  function debouncedLoad() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadRecords, 250);
  }

  async function loadRecords() {
    const params = new URLSearchParams({
      status: statusFilter.value,
      type: typeFilter.value,
      search: searchInput.value.trim()
    });

    try {
      const vehicles = await apiFetch("/vehicles?" + params.toString());
      renderTable(vehicles);
    } catch (err) {
      console.error(err);
    }
  }

  function renderTable(vehicles) {
    tableBody.innerHTML = "";
    emptyState.style.display = vehicles.length === 0 ? "block" : "none";

    vehicles.forEach((v) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="plate">${v.vehicleNumber}</td>
        <td>${v.ownerName}</td>
        <td>${typeLabels[v.type] || v.type}</td>
        <td>${v.slotId}</td>
        <td>${formatDateTime(v.entryTime)}</td>
        <td>${formatDateTime(v.exitTime)}</td>
        <td>${formatDuration(v.durationMinutes)}</td>
        <td>${v.fee != null ? "₹" + v.fee : "—"}</td>
        <td><span class="badge badge-${v.status}">${v.status === "parked" ? "Parked" : "Exited"}</span></td>
      `;
      tableBody.appendChild(tr);
    });
  }

  searchInput.addEventListener("input", debouncedLoad);
  statusFilter.addEventListener("change", loadRecords);
  typeFilter.addEventListener("change", loadRecords);

  loadRecords();
</script>
</body>
</html>
